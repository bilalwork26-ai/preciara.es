name: "[Temporal] Comprobación puntual: productos Adidas en producción"

# Workflow TEMPORAL y de SOLO LECTURA, para una única verificación manual —
# no forma parte de la arquitectura de sincronización de Awin (no modifica
# awin-catalog-sync.yml ni ningún otro flujo) y puede borrarse en cuanto se
# haya usado. Solo hace peticiones GET públicas a preciara.es (nunca
# escribe nada) para comprobar, desde un runner con salida a internet, si
# hay productos de Adidas visibles — este entorno de desarrollo no tiene
# acceso de red a preciara.es ni a developer.ebay.com (bloqueados por la
# política de red del entorno), así que esta comprobación se hace desde
# GitHub Actions, que sí llega (ya lo hace el propio awin-catalog-sync.yml).
on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    name: Comprobar sitemap.xml y búsqueda pública de "adidas"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: sitemap.xml — productos reales indexados
        shell: bash
        run: |
          set -e
          code=$(curl -sS -o /tmp/sitemap.xml -w "%{http_code}" --max-time 20 "https://preciara.es/sitemap.xml")
          echo "HTTP status: $code"
          if [ "$code" != "200" ]; then
            echo "::error::sitemap.xml no respondió 200."
            exit 1
          fi
          echo "Tamaño: $(wc -c < /tmp/sitemap.xml) bytes"
          echo "Entradas /producto/: $(grep -oc '/producto/' /tmp/sitemap.xml || true)"
          echo "Entradas con 'adidas' en la URL (case-insensitive): $(grep -oic 'adidas' /tmp/sitemap.xml || true)"
          echo "--- primeras coincidencias 'adidas' ---"
          grep -i 'adidas' /tmp/sitemap.xml | head -20 || echo "(ninguna)"

      - name: /buscar?q=adidas — página pública de búsqueda
        shell: bash
        run: |
          set -e
          code=$(curl -sS -o /tmp/buscar.html -w "%{http_code}" --max-time 20 "https://preciara.es/buscar?q=adidas")
          echo "HTTP status: $code"
          echo "Tamaño: $(wc -c < /tmp/buscar.html) bytes"
          echo "Menciones de 'adidas' (case-insensitive): $(grep -oic 'adidas' /tmp/buscar.html || true)"
          echo "Menciones de '/producto/': $(grep -oc '/producto/' /tmp/buscar.html || true)"
          echo "Indicio de estado vacío ('no se han encontrado', 'sin resultados'): $(grep -oic 'no se han encontrado\|sin resultados\|no results' /tmp/buscar.html || true)"

      - name: /categorias — comprobación general de catálogo real vs. demo
        shell: bash
        run: |
          set -e
          code=$(curl -sS -o /tmp/categorias.html -w "%{http_code}" --max-time 20 "https://preciara.es/categorias")
          echo "HTTP status: $code"
          echo "Tamaño: $(wc -c < /tmp/categorias.html) bytes"

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Ronda de comprobación tras el merge de PR #32 (etiqueta "Datos demo"
      # dinámica) y PR #30 (imágenes reales + enlaces a ficha de detalle):
      # confirma en la portada real que la etiqueta ya no aparece con
      # catálogo real, que hay imágenes externas (no solo el icono de
      # categoría de respaldo) y que existen enlaces /producto/[slug].
      - name: "Portada real: etiqueta 'Datos demo' e imágenes de producto"
        shell: bash
        run: |
          set -e
          code=$(curl -sS -o /tmp/home.html -w "%{http_code}" --max-time 20 "https://preciara.es/")
          echo "HTTP status portada: $code"
          if [ "$code" != "200" ]; then
            echo "::error::La portada no respondió 200."
            exit 1
          fi
          node <<'NODE'
          const fs = require("node:fs");
          const html = fs.readFileSync("/tmp/home.html", "utf8");

          const hasDemoLabel = html.includes("Datos demo");
          console.log(`¿Aparece el texto "Datos demo" en algún punto de la portada?: ${hasDemoLabel ? "SÍ" : "NO"}`);

          const imgRe = /<img\b[^>]*\bsrc=["']([^"']*)["'][^>]*>/gi;
          let m;
          const imgs = [];
          while ((m = imgRe.exec(html))) imgs.push(m[1]);
          const empty = imgs.filter((s) => !s.trim());
          const external = imgs.filter((s) => /^https?:\/\//i.test(s) && !s.includes("preciara.es"));
          const internal = imgs.filter((s) => !/^https?:\/\//i.test(s) || s.includes("preciara.es"));
          console.log(`Total <img> en la portada: ${imgs.length} (externas/reales: ${external.length}, internas/propias: ${internal.length}, con src vacío: ${empty.length})`);
          console.log("Primeras imágenes externas encontradas:");
          for (const s of external.slice(0, 5)) console.log(`  - ${s}`);

          const linkRe = /href=["'](\/producto\/[^"'?#]+)["']/gi;
          const links = new Set();
          let lm;
          while ((lm = linkRe.exec(html))) links.add(lm[1]);
          console.log(`Enlaces /producto/[slug] encontrados en la portada: ${links.size}`);
          for (const l of [...links].slice(0, 10)) console.log(`  - ${l}`);

          fs.writeFileSync("/tmp/product-links.txt", [...links].join("\n"));
          fs.writeFileSync("/tmp/external-images.txt", external.join("\n"));
          NODE

      - name: Comprobar que las imágenes externas de producto resuelven (HTTP 200)
        shell: bash
        run: |
          if [ ! -s /tmp/external-images.txt ]; then
            echo "No se encontraron imágenes externas en la portada — nada que comprobar aquí."
            exit 0
          fi
          fail=0
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 15 -L "$url" || echo "000")
            echo "$code  $url"
            if [ "$code" != "200" ]; then fail=1; fi
          done < <(sort -u /tmp/external-images.txt | head -10)
          if [ "$fail" = "1" ]; then
            echo "::warning::Al menos una imagen externa no respondió 200."
          fi

      # Investigación puntual: el usuario reporta que "Bajadas destacadas"
      # muestra el mismo producto repetido (solo cambia la talla). Antes de
      # escribir ninguna lógica de deduplicación, se necesita ver el texto
      # real de los nombres de producto tal como los sirve la portada real
      # — nunca adivinar el formato exacto (con/sin "Talla", separador,
      # posición del número) a ciegas.
      - name: "Nombres reales de las tarjetas de 'Bajadas destacadas' (investigación de duplicados)"
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const html = fs.readFileSync("/tmp/home.html", "utf8");
          // "line-clamp-2" en el título del producto es la única combinación
          // usada en la portada (evita depender del orden exacto de clases
          // de Tailwind, que puede variar con cambios en el JSX).
          const re = /<[a-z]+\b[^>]*\bclass="[^"]*\bline-clamp-2\b[^"]*"[^>]*>([^<]*)</gi;
          let m;
          const names = [];
          while ((m = re.exec(html))) names.push(m[1].trim());
          console.log(`Tarjetas encontradas en "Bajadas destacadas": ${names.length}`);
          names.forEach((n, i) => console.log(`  ${i + 1}. "${n}"`));
          NODE

      - name: Comprobar que las fichas de detalle de producto responden (no 404) y también tienen imagen real
        shell: bash
        run: |
          if [ ! -s /tmp/product-links.txt ]; then
            echo "::warning::No se encontró ningún enlace /producto/[slug] en la portada — no se puede verificar el detalle."
            exit 0
          fi
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            url="https://preciara.es${path}"
            code=$(curl -sS -o /tmp/detail.html -w "%{http_code}" --max-time 20 "$url")
            echo "HTTP $code  $url"
            if [ "$code" != "200" ]; then
              echo "::error::La ficha de detalle $url no respondió 200."
              exit 1
            fi
            ext=$(grep -oiE '<img[^>]+src="https?://[^"]*"' /tmp/detail.html | grep -vi 'preciara.es' | head -1 || true)
            if [ -n "$ext" ]; then
              echo "  Imagen externa encontrada en el detalle: sí"
            else
              echo "  Imagen externa encontrada en el detalle: no (puede estar usando el icono de categoría de respaldo)"
            fi
          done < <(sort -u /tmp/product-links.txt | head -3)

      # Comprobación puntual tras PR #42: confirma en producción (a) que el
      # panel lateral "Compara. Ahorra. Compra mejor." (datos de demostración
      # fijos) ya no aparece en la portada, y (b) que /categoria usa el
      # contenedor ancho (max-w-none) en vez del max-w-7xl anterior.
      - name: "PR #42: panel lateral retirado de la portada y contenedor ancho en /categoria"
        shell: bash
        run: |
          set -e
          if grep -q "Compara. Ahorra. Compra mejor." /tmp/home.html; then
            echo "::error::La portada TODAVÍA muestra el panel lateral de demostración — el despliegue no ha recogido la PR #42."
            exit 1
          fi
          echo "Panel lateral 'Compara. Ahorra. Compra mejor.': NO aparece (correcto, PR #42 ya en vivo)."

          category_path=$(head -1 /tmp/product-links.txt | sed -E 's#^/producto/.*$##')
          code=$(curl -sS -o /tmp/categorias-index.html -w "%{http_code}" --max-time 20 "https://preciara.es/categorias")
          echo "HTTP /categorias: $code"
          cat_path=$(grep -oE 'href="/categoria/[^"]+"' /tmp/categorias-index.html | head -1 | sed -E 's/^href="//; s/"$//')
          if [ -z "$cat_path" ]; then
            echo "::warning::No se encontró ningún enlace /categoria/[slug] en /categorias — no se puede verificar el contenedor ancho."
            exit 0
          fi
          code=$(curl -sS -o /tmp/categoria-check.html -w "%{http_code}" --max-time 20 "https://preciara.es${cat_path}")
          echo "HTTP ${cat_path}: $code"
          if grep -oE 'class="[^"]*max-w-none[^"]*"' /tmp/categoria-check.html | head -1; then
            echo "Contenedor ancho (max-w-none) SÍ presente en ${cat_path} (correcto, PR #42 ya en vivo)."
          else
            echo "::error::No se encontró max-w-none en ${cat_path} — el despliegue no ha recogido la PR #42."
            exit 1
          fi

  awin_list:
    name: "Lista real de feeds de Awin: ¿Adidas está Joined?"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AWIN_DATAFEED_API_KEY: ${{ secrets.AWIN_DATAFEED_API_KEY }}
      AWIN_DATAFEED_LIST_URL: ${{ secrets.AWIN_DATAFEED_LIST_URL }}
    steps:
      - name: Comprobar secreto obligatorio
        shell: bash
        run: |
          if [ -z "$AWIN_DATAFEED_API_KEY" ]; then
            echo "::error::Falta el secreto AWIN_DATAFEED_API_KEY."
            exit 3
          fi
          if [ -n "$AWIN_DATAFEED_LIST_URL" ]; then
            echo "AWIN_DATAFEED_LIST_URL SÍ está disponible como secreto de GitHub Actions: se usará esa URL (interfaz nueva de Awin), igual que haría producción si Hostinger la tiene configurada."
          else
            echo "AWIN_DATAFEED_LIST_URL NO está disponible como secreto de GitHub Actions: se usará la URL Legacy por defecto (productdata.awin.com) — puede NO coincidir con lo que usa producción si Hostinger sí la tiene configurada (ese valor vive solo en Hostinger, no aquí)."
          fi

      # Si AWIN_DATAFEED_LIST_URL está disponible, se usa tal cual (misma
      # validación que buildAwinFeedListUrl en awinTransport.ts: debe ser
      # ui.awin.com/productdata-darwin-download/publisher/.../feedlist).
      # Si no, fallback a la URL Legacy que construye downloadAwinFeedList()
      # por defecto. La URL en sí (lleva la API key) NUNCA se imprime; solo
      # columnas no sensibles del CSV (Advertiser ID/Name, Primary Region,
      # Membership Status) — nunca la columna URL (token de descarga).
      - name: Descargar la lista real de feeds de Awin
        shell: bash
        run: |
          set -e
          if [ -n "$AWIN_DATAFEED_LIST_URL" ]; then
            target="$AWIN_DATAFEED_LIST_URL"
          else
            target="https://productdata.awin.com/datafeed/list/apikey/${AWIN_DATAFEED_API_KEY}"
          fi
          code=$(curl -sS -o /tmp/awin-list.csv -w "%{http_code}" --max-time 60 "$target")
          echo "HTTP status: $code"
          if [ "$code" != "200" ]; then
            echo "::error::La lista de feeds de Awin no respondió 200 (clave/URL inválida o caducada, cuenta sin acceso Legacy, o problema de red)."
            exit 1
          fi
          echo "Tamaño: $(wc -c < /tmp/awin-list.csv) bytes"
          echo "Líneas totales (incl. cabecera): $(wc -l < /tmp/awin-list.csv)"

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Analizar la lista (columnas seguras únicamente, nunca la URL de descarga)
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const raw = fs.readFileSync("/tmp/awin-list.csv", "utf8");

          // Parser CSV mínimo (soporta comillas dobles y comas dentro de
          // campos entrecomillados) — suficiente para un diagnóstico
          // puntual, no se reutiliza en producción (ver streamingCsv.ts).
          function parseCsv(text) {
            const rows = [];
            let row = [];
            let field = "";
            let inQuotes = false;
            for (let i = 0; i < text.length; i++) {
              const c = text[i];
              if (inQuotes) {
                if (c === '"') {
                  if (text[i + 1] === '"') { field += '"'; i++; }
                  else inQuotes = false;
                } else field += c;
              } else if (c === '"') inQuotes = true;
              else if (c === ",") { row.push(field); field = ""; }
              else if (c === "\n" || c === "\r") {
                if (c === "\r" && text[i + 1] === "\n") i++;
                row.push(field); field = "";
                if (row.length > 1 || row[0] !== "") rows.push(row);
                row = [];
              } else field += c;
            }
            if (field !== "" || row.length > 0) { row.push(field); rows.push(row); }
            return rows;
          }

          const rows = parseCsv(raw);
          const header = rows[0].map((h) => h.trim());
          const idx = (name) => header.findIndex((h) => h.toLowerCase() === name.toLowerCase());
          const iId = idx("Advertiser ID");
          const iName = idx("Advertiser Name");
          const iRegion = idx("Primary Region");
          const iStatus = idx("Membership Status");
          console.log("Cabecera detectada:", header.filter((h) => h.toLowerCase() !== "url").join(" | "));
          if (iId < 0 || iName < 0 || iStatus < 0) {
            console.log("::error::No se encontraron las columnas esperadas (Advertiser ID/Name/Membership Status).");
            process.exit(1);
          }

          const dataRows = rows.slice(1).filter((r) => r.length === header.length);
          const joined = dataRows.filter((r) => (r[iStatus] || "").trim().toLowerCase() === "joined");
          console.log(`Total de filas de datos: ${dataRows.length}`);
          console.log(`Total con Membership Status = Joined (aprobados): ${joined.length}`);

          const adidasRows = dataRows.filter((r) => (r[iName] || "").toLowerCase().includes("adidas"));
          console.log(`Filas cuyo Advertiser Name contiene "adidas": ${adidasRows.length}`);
          for (const r of adidasRows) {
            console.log(`  - Advertiser ID=${r[iId]} | Name="${r[iName]}" | Region=${iRegion >= 0 ? r[iRegion] : "?"} | Membership Status=${r[iStatus]}`);
          }
          NODE
