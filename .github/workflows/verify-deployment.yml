name: "[Temporal] Verificacion de despliegue en produccion"

# Comprobacion puntual, disparada a mano (workflow_dispatch), para
# confirmar que preciara.es en produccion esta sirviendo el commit
# correcto tras un despliegue -- nunca se ejecuta automaticamente (sin
# `schedule` ni `push`/`pull_request`), asi que nunca genera alertas por
# correo por su cuenta. Pensado para borrarse en cuanto deje de hacer
# falta (mismo criterio que el resto de comprobaciones ad-hoc de este
# repositorio).

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: "Commit que deberia estar sirviendo produccion (se compara con la cabecera x-build-commit)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  check:
    name: Comprobar x-build-commit y rutas nuevas en preciara.es
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # --connect-timeout/--max-time cortos y --retry: distingue en
      # segundos un fallo de red persistente de uno puntual, en vez de
      # esperar el timeout de red por defecto (varios minutos) en cada
      # intento -- la primera ejecucion de este workflow tardo 270s en
      # fallar con "Couldn't connect to server" por esto mismo.
      - name: Cabeceras de la portada (sin cache)
        run: |
          echo "== GET https://preciara.es/ =="
          curl -sS --connect-timeout 15 --max-time 30 --retry 3 --retry-delay 5 --retry-all-errors \
            -D - -o /tmp/home.html "https://preciara.es/?cachebust=$(date +%s)"

      - name: Comparar x-build-commit con el commit esperado (si se indico)
        if: ${{ inputs.expected_commit != '' }}
        run: |
          actual=$(curl -sS --connect-timeout 15 --max-time 30 --retry 3 --retry-delay 5 --retry-all-errors \
            -D - -o /dev/null "https://preciara.es/?cachebust=$(date +%s)" | grep -i '^x-build-commit:' | tr -d '\r' | awk '{print $2}')
          echo "Commit esperado:  ${{ inputs.expected_commit }}"
          echo "Commit detectado: $actual"
          if [ "$actual" != "${{ inputs.expected_commit }}" ]; then
            echo "::error::El commit servido no coincide con el esperado."
            exit 1
          fi
          echo "Coincide."

      - name: Comprobar que las rutas nuevas de esta sesion responden
        run: |
          for path in "/" "/categoria/moda" "/categoria/tecnologia" "/categoria/hogar" "/categorias"; do
            code=$(curl -sS --connect-timeout 15 --max-time 30 --retry 3 --retry-delay 5 --retry-all-errors \
              -o /dev/null -w "%{http_code}" "https://preciara.es${path}")
            echo "$path -> $code"
            if [ "$code" != "200" ]; then
              echo "::error::${path} respondio $code, se esperaba 200"
              exit 1
            fi
          done

      - name: Buscar 'Supergangas' en el HTML de la portada (confirma que el bloque nuevo esta desplegado)
        run: |
          if grep -qi 'Supergangas' /tmp/home.html; then
            echo "'Supergangas' encontrado en la portada."
          else
            echo "::error::'Supergangas' NO aparece en la portada -- ¿sigue desplegado un commit antiguo?"
            exit 1
          fi
