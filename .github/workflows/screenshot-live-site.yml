name: "[Temporal] Captura del sitio en produccion"

# Comprobacion puntual, disparada a mano (workflow_dispatch) -- nunca
# automatica, nunca genera alertas por correo. Captura la Home y una
# ficha de producto reales de preciara.es y las publica en una rama
# huerfana temporal (nunca en main): el artefacto de Actions se sirve
# desde Azure Blob Storage, inalcanzable desde el sandbox que revisa
# estas capturas, pero raw.githubusercontent.com si lo es. Pensado para
# borrarse (workflow y rama) en cuanto deje de hacer falta.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar el codigo (solo para poder publicar la rama temporal)
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar Playwright (Chromium)
        run: |
          npm init -y >/dev/null
          npm install playwright@latest >/dev/null
          npx playwright install --with-deps chromium

      - name: Capturar Home y una ficha de producto reales
        run: |
          node -e "
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({ viewport: { width: 1280, height: 2200 } });

            await page.goto('https://preciara.es/', { waitUntil: 'networkidle', timeout: 30000 });
            await page.screenshot({ path: 'home.png', fullPage: true });
            console.log('Home capturada.');

            const productHref = await page.evaluate(() => {
              const a = document.querySelector('a[href^=\"/producto/\"]');
              return a ? a.getAttribute('href') : null;
            });
            console.log('Enlace de producto encontrado:', productHref);

            if (productHref) {
              await page.goto('https://preciara.es' + productHref, { waitUntil: 'networkidle', timeout: 30000 });
              await page.screenshot({ path: 'producto.png', fullPage: true });
              console.log('Ficha de producto capturada.');
            }

            await browser.close();
          })().catch((err) => { console.error(err); process.exit(1); });
          "

      - name: Publicar las capturas en una rama huerfana temporal
        run: |
          mkdir -p /tmp/shots
          cp home.png /tmp/shots/home.png
          cp producto.png /tmp/shots/producto.png 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan tmp/screenshots-live-site
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/shots/*.png .
          git add *.png
          git commit -m "tmp: capturas de preciara.es para revision (rama desechable)"
          git push --force origin tmp/screenshots-live-site
