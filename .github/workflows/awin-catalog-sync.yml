name: Sincronización del catálogo de Awin

# GitHub actúa únicamente como reloj: firma una solicitud y la envía a la
# aplicación de Preciara. La sincronización y el acceso a MySQL ocurren dentro
# de Hostinger, donde "localhost:3306" sí es la base de datos correcta.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simular sin modificar la base de datos"
        required: true
        default: true
        type: boolean
  schedule:
    # Dos veces al día, cada ~12 horas. Se evita el inicio de la hora para
    # repartir la carga tanto en GitHub Actions como en los servidores de Awin.
    - cron: "17 4 * * *" # ~06:17 en Madrid en horario de verano
    - cron: "17 16 * * *" # ~18:17 en Madrid en horario de verano

permissions:
  contents: read

concurrency:
  group: awin-catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Solicitar sincronización de productos de Awin
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      AWIN_DATAFEED_API_KEY: ${{ secrets.AWIN_DATAFEED_API_KEY }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}

    steps:
      - name: Comprobar secreto obligatorio
        shell: bash
        run: |
          if [ -z "$AWIN_DATAFEED_API_KEY" ]; then
            echo "::error::Falta el secreto AWIN_DATAFEED_API_KEY."
            exit 3
          fi

      # Las ejecuciones programadas esperan entre 10 y 120 segundos para no
      # coincidir siempre con el pico de peticiones de otros publicadores.
      - name: Espera aleatoria antes de la ejecución programada
        if: github.event_name == 'schedule'
        shell: bash
        run: sleep $((10 + RANDOM % 111))

      # Misma versión de Node que el resto del proyecto (ver ci.yml). El
      # runner de ubuntu-latest trae un Node preinstalado, pero fijarla
      # explícitamente evita depender de la imagen y elimina el aviso de
      # GitHub Actions sobre no declarar una versión de Node.
      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Solicitar la sincronización dentro de Hostinger
        shell: bash
        run: |
          node <<'NODE'
          const { createHmac } = require("node:crypto");

          // Un único intento fallido no distingue entre un problema real de
          // autorización (firma/clave incorrectas: eso falla siempre, en
          // todo intento) y un rechazo puntual de una capa delante de la
          // aplicación (proxy/WAF de Hostinger), que un segundo intento con
          // una firma nueva suele resolver solo. Reintentar aquí evita que
          // un bloqueo transitorio deje la ejecución en rojo sin necesidad.
          const MAX_ATTEMPTS = 3;
          const RETRY_DELAY_MS = [5000, 15000];

          function wait(ms) {
            return new Promise((resolve) => setTimeout(resolve, ms));
          }

          (async () => {
            const secret = process.env.AWIN_DATAFEED_API_KEY?.trim();
            if (!secret) {
              console.error("Falta AWIN_DATAFEED_API_KEY.");
              process.exitCode = 3;
              return;
            }

            const dryRun = process.env.DRY_RUN === "true";

            for (let attempt = 1; attempt <= MAX_ATTEMPTS; attempt++) {
              // Firma nueva en cada intento: nunca reenviar una firma ya
              // usada (evita reutilizarla fuera de la ventana de 5 minutos
              // que exige el servidor).
              const timestamp = String(Math.floor(Date.now() / 1000));
              const body = JSON.stringify({ dryRun });
              const signature = createHmac("sha256", secret)
                .update(`${timestamp}.${body}`)
                .digest("hex");

              let response;
              try {
                response = await fetch("https://preciara.es/api/jobs/awin-sync", {
                  method: "POST",
                  headers: {
                    "content-type": "application/json",
                    "x-preciara-timestamp": timestamp,
                    "x-preciara-signature": signature,
                  },
                  body,
                });
              } catch {
                console.error(`Intento ${attempt}/${MAX_ATTEMPTS}: no se pudo contactar con Hostinger.`);
                if (attempt < MAX_ATTEMPTS) {
                  await wait(RETRY_DELAY_MS[attempt - 1]);
                  continue;
                }
                process.exitCode = 1;
                return;
              }

              if (response.status === 202) {
                console.log(`Solicitud aceptada por Hostinger (dryRun=${dryRun}, intento ${attempt}/${MAX_ATTEMPTS}).`);
                return;
              }

              // El cuerpo de esta respuesta lo genera Hostinger (o una capa
              // delante de la aplicación), nunca nuestra ruta con la clave
              // de Awin — es seguro registrarlo, y ayuda a diagnosticar un
              // rechazo que no pasa por /api/jobs/awin-sync. Se trunca por
              // si fuera HTML largo de una página de bloqueo.
              const snippet = (await response.text().catch(() => "")).slice(0, 300);
              console.error(`Intento ${attempt}/${MAX_ATTEMPTS}: Hostinger rechazó la solicitud (HTTP ${response.status}). ${snippet}`);

              if (attempt < MAX_ATTEMPTS) {
                await wait(RETRY_DELAY_MS[attempt - 1]);
                continue;
              }
              process.exitCode = 1;
            }
          })();
          NODE
