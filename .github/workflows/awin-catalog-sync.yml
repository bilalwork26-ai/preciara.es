name: Sincronización del catálogo de Awin

# GitHub actúa únicamente como reloj: firma una solicitud y la envía a la
# aplicación de Preciara. La sincronización y el acceso a MySQL ocurren dentro
# de Hostinger, donde "localhost:3306" sí es la base de datos correcta.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simular sin modificar la base de datos"
        required: true
        default: true
        type: boolean
  schedule:
    # Todos los días a las 04:17 UTC. Se evita el inicio de la hora para
    # repartir la carga tanto en GitHub Actions como en los servidores de Awin.
    - cron: "17 4 * * *"

permissions:
  contents: read

concurrency:
  group: awin-catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Solicitar sincronización de productos de Awin
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      AWIN_DATAFEED_API_KEY: ${{ secrets.AWIN_DATAFEED_API_KEY }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}

    steps:
      - name: Comprobar secreto obligatorio
        shell: bash
        run: |
          if [ -z "$AWIN_DATAFEED_API_KEY" ]; then
            echo "::error::Falta el secreto AWIN_DATAFEED_API_KEY."
            exit 3
          fi

      # Las ejecuciones programadas esperan entre 10 y 120 segundos para no
      # coincidir siempre con el pico de peticiones de otros publicadores.
      - name: Espera aleatoria antes de la ejecución programada
        if: github.event_name == 'schedule'
        shell: bash
        run: sleep $((10 + RANDOM % 111))

      - name: Solicitar la sincronización dentro de Hostinger
        shell: bash
        run: |
          node <<'NODE'
          const { createHmac } = require("node:crypto");

          const secret = process.env.AWIN_DATAFEED_API_KEY?.trim();
          if (!secret) {
            console.error("Falta AWIN_DATAFEED_API_KEY.");
            process.exit(3);
          }

          const dryRun = process.env.DRY_RUN === "true";
          const timestamp = String(Math.floor(Date.now() / 1000));
          const body = JSON.stringify({ dryRun });
          const signature = createHmac("sha256", secret)
            .update(`${timestamp}.${body}`)
            .digest("hex");

          const response = await fetch("https://preciara.es/api/jobs/awin-sync", {
            method: "POST",
            headers: {
              "content-type": "application/json",
              "x-preciara-timestamp": timestamp,
              "x-preciara-signature": signature,
            },
            body,
          });

          if (response.status !== 202) {
            console.error(`Hostinger rechazó la solicitud (HTTP ${response.status}).`);
            process.exit(1);
          }

          console.log(`Solicitud aceptada por Hostinger (dryRun=${dryRun}).`);
          NODE
